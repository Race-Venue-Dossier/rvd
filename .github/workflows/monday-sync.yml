name: monday-Sync
# Holt alle 15 Minuten die Einsatzplanung und «Slope Analysis TECH» aus monday (verschlüsselt in data/live.enc).
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: monday-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: monday abfragen
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
          RVD_PASS: ${{ secrets.RVD_PASS }}
        run: node scripts/sync-monday.mjs
      - name: Änderungen speichern
        run: |
          if [ -n "$(git status --porcelain data/live.enc data/live.sha)" ]; then
            git config user.name "monday-Sync"
            git config user.email "actions@users.noreply.github.com"
            git add data/live.enc data/live.sha
            git commit -m "monday-Daten aktualisiert"
            git push
          fi
