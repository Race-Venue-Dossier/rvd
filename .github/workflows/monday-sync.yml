name: monday-Sync
# Holt alle 15 Minuten die Einsatzplanung, «Slope Analysis TECH» und «RVD Sync» aus monday (verschlüsselt in data/live.enc, Dateien in monasset/).
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      fis_test:
        description: 'Nur FIS testen: Dossier-ID eines vergangenen Events (z. B. 2026-57999-M), speichert nichts'
        required: false
        default: ''
  push:
    branches: [main]
    paths-ignore: ['data/live.enc', 'data/live.sha', 'data/fissec.enc', 'data/fissec_done.json', 'monasset/**']
permissions:
  contents: write
concurrency:
  group: monday-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: monday abfragen
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
          RVD_PASS: ${{ secrets.RVD_PASS }}
          FIS_TEST: ${{ inputs.fis_test }}
        run: node scripts/sync-monday.mjs
      - name: FIS-PDFs auswerten (Zwischenzeiten)
        if: hashFiles('fispdf/todo.json') != ''
        env:
          FIS_TEST: ${{ inputs.fis_test }}
        run: |
          if [ "$(cat fispdf/todo.json)" != "[]" ]; then
            pip install --quiet pymupdf
            python3 scripts/fis_pdf.py
          fi
      - name: FIS-Sektordaten speichern
        env:
          RVD_PASS: ${{ secrets.RVD_PASS }}
          FIS_TEST: ${{ inputs.fis_test }}
        run: node scripts/fis-store.mjs
      - name: Änderungen speichern
        run: |
          if [ -n "$(git status --porcelain data/live.enc data/live.sha data/fissec.enc data/fissec_done.json monasset)" ]; then
            git config user.name "monday-Sync"
            git config user.email "actions@users.noreply.github.com"
            git add data/live.enc data/live.sha monasset; git add data/fissec.enc data/fissec_done.json 2>/dev/null || true
            git commit -m "monday-Daten aktualisiert"
            git push
          fi
