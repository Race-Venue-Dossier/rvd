name: Renntag-Abgleich
# Zusätzliche monday-Syncs rund um Events (monday «RVD Sync», Spalte Zeitraum): Vortag 20:00, Eventtage 20:00, letzter Tag 18:00
# (Vonsie, 09.11.2026). Wird vom monday-Sync angestossen (höchstens 20 h vorher); startet sich bei Bedarf nach ~5½ h selbst neu.
on:
  workflow_dispatch:
permissions:
  actions: write
  contents: read
concurrency:
  group: renntag
  cancel-in-progress: false
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Abgleich zu den Terminen starten
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/renntag.mjs loop
